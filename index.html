<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Workout & PR Log</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Gym Log & PR</h1>

    <!-- DASHBOARD STATISTICHE -->
    <div class="card">
      <h2>Statistiche Globali</h2>
      <div class="stats-grid">
        <div class="stat-box">
          <span class="stat-label">Serie Totali</span>
          <span class="stat-value" id="stat-sets">0</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">Volume Totale</span>
          <span class="stat-value" id="stat-volume">0 kg</span>
        </div>
      </div>
    </div>

    <!-- FORM INSERIMENTO SET -->
    <div class="card">
      <h2>Registra Serie</h2>
      <form id="workout-form">
        <div class="form-group">
          <label for="exercise">Esercizio</label>
          <select id="exercise" onchange="toggleCustomExercise()" required>
            <option value="" disabled selected>Seleziona esercizio...</option>
            <optgroup label="Petto e Tricipiti">
              <option value="Panca Piana">Panca Piana</option>
              <option value="Panca Inclinata">Panca Inclinata</option>
              <option value="Dip Parallele">Dip Parallele</option>
            </optgroup>
            <optgroup label="Dorso e Bicipiti">
              <option value="Trazioni">Trazioni</option>
              <option value="Rematore">Rematore</option>
              <option value="Stacco da Terra">Stacco da Terra</option>
            </optgroup>
            <optgroup label="Gambe e Spalle">
              <option value="Squat">Squat</option>
              <option value="Pressa">Pressa</option>
              <option value="Military Press">Military Press</option>
              <option value="Alzate Laterali">Alzate Laterali</option>
            </optgroup>
            <optgroup label="Altro">
              <option value="custom">Inserisci manualmente...</option>
            </optgroup>
          </select>
          <!-- Input nascosto per l'esercizio personalizzato -->
          <input type="text" id="custom-exercise-input" class="hidden-input" placeholder="Scrivi il nome dell'esercizio...">
        </div>

        <div class="row">
          <div class="form-group">
            <label for="weight">Peso (kg)</label>
            <input type="number" id="weight" min="0" step="0.5" placeholder="es. 80" required>
          </div>
          <div class="form-group">
            <label for="reps">Reps</label>
            <input type="number" id="reps" min="1" placeholder="es. 8" required>
          </div>
        </div>

        <button type="submit">Salva Serie</button>
      </form>
    </div>

    <!-- TIMER RECUPERO -->
    <div class="card timer-card">
      <h2>Timer Recupero</h2>
      <div id="timer-display">01:30</div>
      <div class="timer-controls">
        <button type="button" class="btn-sec" onclick="setTimer(60)">60s</button>
        <button type="button" class="btn-sec" onclick="setTimer(90)">90s</button>
        <button type="button" class="btn-sec" onclick="setTimer(120)">120s</button>
        <button type="button" class="btn-action" id="start-timer-btn" onclick="toggleTimer()">Avvia</button>
      </div>
    </div>

    <!-- SEZIONE RECORD PERSONALI -->
    <div class="card">
      <h2>I Miei PR (Massimali)</h2>
      <ul id="pr-list">
        <p class="empty-msg">Nessun record registrato finora.</p>
      </ul>
    </div>

    <!-- SEZIONE STORICO RAGGRUPPATO -->
    <div class="card">
      <h2>Ultimi Allenamenti</h2>
      <div id="history-container">
        <p class="empty-msg">Nessuna serie salvata.</p>
      </div>
    </div>

    <!-- GESTIONE DATI -->
    <div class="card settings-card">
      <h2>Gestione Dati</h2>
      <p class="settings-desc">Esporta o ripristina il tuo storico allenamenti.</p>
      <div class="row">
        <button type="button" class="btn-sec" onclick="exportData()">Esporta JSON</button>
        <button type="button" class="btn-sec" onclick="document.getElementById('import-file').click()">Importa JSON</button>
        <input type="file" id="import-file" accept=".json" style="display: none;" onchange="importData(event)">
      </div>
    </div>

  </div>

  <!-- Contenitore Notifiche Toast -->
  <div id="toast-container"></div>

  <script src="script.js"></script>
</body>
</html>
